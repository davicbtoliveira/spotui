name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install native audio dependencies
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libflac-dev libvorbis-dev pkg-config

      - name: Test without credentials, browser, network, or audio
        run: go test -race ./...

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-22.04
            goos: linux
            goarch: amd64
            suffix: linux-amd64
            tar: tar
          - runner: macos-15-intel
            goos: darwin
            goarch: amd64
            suffix: darwin-amd64
            tar: gtar
          - runner: macos-15
            goos: darwin
            goarch: arm64
            suffix: darwin-arm64
            tar: gtar
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: Install Linux audio dependencies
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev libflac-dev libvorbis-dev pkg-config

      - name: Install macOS audio dependencies
        if: runner.os == 'macOS'
        run: brew install flac libvorbis gnu-tar pkg-config

      - name: Build standalone archive
        env:
          CGO_ENABLED: "1"
          GOOS: ${{ matrix.goos }}
          GOARCH: ${{ matrix.goarch }}
        run: |
          archive="spotui-${{ matrix.suffix }}"
          mkdir -p "dist/$archive"
          go build -trimpath -buildvcs=false -ldflags="-s -w -buildid=" -o "dist/$archive/spotui" .
          cp LICENSE THIRD_PARTY_NOTICES.md "dist/$archive/"
          "${{ matrix.tar }}" --sort=name --mtime="@0" --owner=0 --group=0 --numeric-owner \
            -cf - -C dist "$archive" | gzip -n > "dist/$archive.tar.gz"

      - name: Build portable Linux AppImage
        if: runner.os == 'Linux'
        env:
          APPIMAGE_EXTRACT_AND_RUN: "1"
          NO_STRIP: "1"
        run: |
          appdir="$RUNNER_TEMP/spotui.AppDir"
          appimage_workdir="$RUNNER_TEMP/spotui-appimage"
          mkdir -p \
            "$appdir/usr/bin" \
            "$appdir/usr/share/applications" \
            "$appdir/usr/share/icons/hicolor/scalable/apps" \
            "$appimage_workdir"
          cp "dist/spotui-${{ matrix.suffix }}/spotui" "$appdir/usr/bin/spotui"
          cp LICENSE THIRD_PARTY_NOTICES.md "$appdir/"
          cp packaging/spotui.desktop "$appdir/usr/share/applications/spotui.desktop"
          cp packaging/spotui.svg "$appdir/usr/share/icons/hicolor/scalable/apps/spotui.svg"
          curl --fail --location --silent --show-error \
            https://github.com/linuxdeploy/linuxdeploy/releases/download/continuous/linuxdeploy-x86_64.AppImage \
            --output "$appimage_workdir/linuxdeploy.AppImage"
          chmod +x "$appimage_workdir/linuxdeploy.AppImage"
          cd "$appimage_workdir"
          "$appimage_workdir/linuxdeploy.AppImage" \
            --appdir "$appdir" \
            --executable "$appdir/usr/bin/spotui" \
            --desktop-file "$appdir/usr/share/applications/spotui.desktop" \
            --icon-file "$appdir/usr/share/icons/hicolor/scalable/apps/spotui.svg" \
            --output appimage
          appimage="$(find . -maxdepth 1 -type f -name '*.AppImage' -print -quit)"
          test -n "$appimage"
          mv "$appimage" "$GITHUB_WORKSPACE/dist/spotui-linux-amd64.AppImage"

      - uses: actions/upload-artifact@v4
        if: runner.os == 'macOS'
        with:
          name: spotui-${{ matrix.suffix }}
          path: dist/spotui-${{ matrix.suffix }}.tar.gz
          if-no-files-found: error

      - name: Upload portable Linux AppImage
        if: runner.os == 'Linux'
        uses: actions/upload-artifact@v4
        with:
          name: spotui-linux-amd64-appimage
          path: dist/spotui-linux-amd64.AppImage
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: spotui-*
          path: dist
          merge-multiple: true

      - name: Generate checksums
        run: cd dist && sha256sum spotui-*.tar.gz spotui-*.AppImage > SHA256SUMS

      - uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/spotui-*.tar.gz
            dist/spotui-*.AppImage
            dist/SHA256SUMS
